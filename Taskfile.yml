# SPDX-License-Identifier: AGPL-3.0-or-later
#
# Task runner for Rocket2Matter — https://taskfile.dev
#
#   task            # list tasks
#   task check      # typecheck + tests
#   task migrate    # full migration (see rocket2matter.env)
#   task e2e        # end-to-end test against a real Mattermost (Docker)
#
version: "3"

vars:
  PNPM: pnpm

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list
    silent: true

  install:
    desc: Install dependencies
    cmds:
      - "{{.PNPM}} install"

  typecheck:
    desc: TypeScript type checking (no emit)
    cmds:
      - "{{.PNPM}} typecheck"

  test:
    desc: Run the integration test (in-memory MongoDB)
    cmds:
      - "{{.PNPM}} test"

  check:
    desc: Typecheck then run tests
    cmds:
      - task: typecheck
      - task: test

  init:
    desc: Create rocket2matter.env (commented configuration to fill in)
    cmds:
      - "{{.PNPM}} cli init"

  preflight:
    desc: Check source, local machine and target; offer fixes
    cmds:
      - "{{.PNPM}} cli preflight {{.CLI_ARGS}}"

  migrate:
    desc: "Full migration, resumable (preflight → export → package → upload → import → post-import → verify → cleanup). Use `-- --from <step>` / `-- --yes`."
    cmds:
      - "{{.PNPM}} cli migrate {{.CLI_ARGS}}"

  export:
    desc: "Export RocketChat → out/ (import.jsonl + data/ + readstate.sql)"
    cmds:
      - "{{.PNPM}} cli export"

  package:
    desc: Package out/ into the import zip
    cmds:
      - "{{.PNPM}} cli package"

  reset-password:
    desc: "Reset a migrated user's password (interactive). Use `-- --dry-run` to preview."
    cmds:
      - "{{.PNPM}} cli reset-password {{.CLI_ARGS}}"

  e2e:
    desc: "End-to-end test: real migrate into a stock Mattermost in Docker (KEEP=1 to keep containers)"
    cmds:
      - test/e2e/run.sh

  bundle:
    desc: Bundle the CLI into dist/cli.cjs (esbuild)
    cmds:
      - "{{.PNPM}} bundle"

  build:
    desc: Build the standalone binary → dist/rocket2matter
    cmds:
      - "{{.PNPM}} build:binary"

  ci:
    desc: Install + typecheck + test (what CI runs)
    cmds:
      - task: install
      - task: typecheck
      - task: test

  clean:
    desc: Remove build/export artifacts (dist/, out/, *.zip)
    cmds:
      - rm -rf dist out out.state.json mattermost-import.zip test/e2e/work
